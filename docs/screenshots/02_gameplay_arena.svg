<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="arenaBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#142e4d" />
      <stop offset="60%" stop-color="#081424" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="100%" stop-color="#e5a93b" />
    </linearGradient>
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#arenaBg)" />

  <!-- Stadium Lighting & Architectural lines -->
  <path d="M 0 120 L 1200 120" stroke="#162e4a" stroke-width="1.5" />
  <path d="M 150 120 L 350 480" stroke="#0f2136" stroke-width="2" opacity="0.6" />
  <path d="M 1050 120 L 850 480" stroke="#0f2136" stroke-width="2" opacity="0.6" />

  <!-- HUD Bar Top -->
  <g transform="translate(40, 20)">
    <rect width="1120" height="74" rx="14" fill="rgba(6,16,31,0.85)" stroke="#1c3757" stroke-width="1.5" />
    
    <!-- Left: Athlete -->
    <text x="25" y="32" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CHALLENGE MODE</text>
    <text x="25" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">ATHLETE_ONE</text>
    <text x="175" y="55" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">· CONTENDER (MEDIUM)</text>
    
    <!-- Center: Timer & Instructions -->
    <text x="560" y="32" fill="#9db6d6" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">HIT THE HIGHLIGHTED TARGET</text>
    <g transform="translate(528, 38)">
      <rect width="64" height="28" rx="6" fill="#173559" stroke="#f7cc73" stroke-width="1" />
      <text x="32" y="20" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" text-anchor="middle">08s</text>
    </g>

    <!-- Right: Live Score -->
    <text x="1090" y="32" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1.5">LIVE SCORE</text>
    <text x="1090" y="58" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="900" text-anchor="end">
      29 <tspan fill="#627d9e" font-size="16" font-weight="500">/ 90</tspan>
    </text>
  </g>

  <!-- Targets Representation -->
  <!-- Target 1: Passive/Inactive (Left) -->
  <g transform="translate(230, 310)" opacity="0.45">
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#9bb1cf" stroke-width="1.5" />
    <circle cx="0" cy="0" r="43" fill="#1b2128" />
    <circle cx="0" cy="0" r="32" fill="#008ecc" />
    <circle cx="0" cy="0" r="21" fill="#e53935" />
    <circle cx="0" cy="0" r="10" fill="#ffb300" />
    <text x="0" y="80" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">TARGET 01</text>
  </g>

  <!-- Target 2: ACTIVE TARGET (Center, Large, Glowing) -->
  <g transform="translate(600, 320)">
    <!-- Active Target Halo -->
    <circle cx="0" cy="0" r="176" fill="none" stroke="#f7cc73" stroke-width="3" stroke-dasharray="10 6" opacity="0.8" filter="url(#laserGlow)" />
    <circle cx="0" cy="0" r="150" fill="#ffffff" stroke="#bccde2" stroke-width="2" />
    <circle cx="0" cy="0" r="120" fill="#1a202c" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="0" r="90" fill="#008ecc" stroke="#006b99" stroke-width="2" />
    <circle cx="0" cy="0" r="60" fill="#e53935" stroke="#b71c1c" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="#ffb300" stroke="#ff8f00" stroke-width="2" filter="url(#laserGlow)" />
    <circle cx="0" cy="0" r="10" fill="#fff176" />
    <text x="0" y="5" fill="#1b2128" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" text-anchor="middle">10</text>
    
    <!-- Arrow Impact Mark (10-Ring Hit) -->
    <circle cx="6" cy="-8" r="4.5" fill="#ff3b30" stroke="#ffffff" stroke-width="1.5" filter="url(#laserGlow)" />
    <text x="6" y="-18" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">+10 🎯</text>

    <!-- Active Label -->
    <rect x="-65" y="185" width="130" height="26" rx="13" fill="#f7cc73" />
    <text x="0" y="202" fill="#0c1726" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">ACTIVE TARGET</text>
  </g>

  <!-- Target 3: Passive/Inactive (Right) -->
  <g transform="translate(970, 310)" opacity="0.45">
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#9bb1cf" stroke-width="1.5" />
    <circle cx="0" cy="0" r="43" fill="#1b2128" />
    <circle cx="0" cy="0" r="32" fill="#008ecc" />
    <circle cx="0" cy="0" r="21" fill="#e53935" />
    <circle cx="0" cy="0" r="10" fill="#ffb300" />
    <text x="0" y="80" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">TARGET 03</text>
  </g>

  <!-- Bottom HUD / Tracker -->
  <g transform="translate(40, 575)">
    <rect width="1120" height="80" rx="14" fill="rgba(6,16,31,0.9)" stroke="#1c3757" stroke-width="1.5" />
    
    <!-- Round Tracker Pills -->
    <text x="25" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">TARGET PROGRESS</text>
    <rect x="25" y="38" width="60" height="28" rx="6" fill="#193b61" stroke="#f7cc73" stroke-width="1" />
    <text x="55" y="56" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">T1 ✓</text>
    <rect x="95" y="38" width="60" height="28" rx="6" fill="#244d7d" stroke="#5da0e6" stroke-width="1.5" />
    <text x="125" y="56" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" text-anchor="middle">T2 ●</text>
    <rect x="165" y="38" width="60" height="28" rx="6" fill="#102033" stroke="#233a52" stroke-width="1" />
    <text x="195" y="56" fill="#607b9b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">T3</text>

    <!-- Shot Slots -->
    <text x="320" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">CURRENT TARGET · BEST 3 COUNT</text>
    <g transform="translate(320, 38)">
      <rect x="0" y="0" width="46" height="28" rx="6" fill="#183658" stroke="#385e8a" stroke-width="1" />
      <text x="23" y="19" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">10</text>
      
      <rect x="54" y="0" width="46" height="28" rx="6" fill="#183658" stroke="#385e8a" stroke-width="1" />
      <text x="77" y="19" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">10</text>

      <rect x="108" y="0" width="46" height="28" rx="6" fill="#183658" stroke="#385e8a" stroke-width="1" />
      <text x="131" y="19" fill="#9db6d6" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle">9</text>

      <rect x="162" y="0" width="46" height="28" rx="6" fill="#0d1b2a" stroke="#20344a" stroke-width="1" stroke-dasharray="3 3" />
      <text x="185" y="19" fill="#506782" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">—</text>
    </g>

    <!-- LiDAR & Input Status -->
    <g transform="translate(860, 36)">
      <circle cx="10" cy="14" r="5" fill="#30d158" filter="url(#laserGlow)" />
      <text x="26" y="18" fill="#b9d6f2" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">INPUT READY: Touch / LiDAR</text>
      <rect x="190" y="0" width="60" height="28" rx="6" fill="#2d1518" stroke="#ff453a" stroke-width="1" />
      <text x="220" y="18" fill="#ff453a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXIT</text>
    </g>
  </g>
</svg>

