  <!-- Footer Actions -->
  <g transform="translate(150, 600)">
    <text x="0" y="24" fill="#6784a8" font-family="'Segoe UI', sans-serif" font-size="13">248 sessions registered · SQLite Powered</text>
    <rect x="730" y="0" width="170" height="38" rx="8" fill="#f7cc73" />
    <text x="815" y="24" fill="#0d1b2a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" text-anchor="middle">NEW CHALLENGE ➜</text>
  </g>
</svg>

