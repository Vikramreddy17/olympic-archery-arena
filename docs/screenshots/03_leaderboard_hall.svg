      <rect x="368" y="18" width="68" height="24" rx="6" fill="#183658" />
      <text x="402" y="34" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">HARD</text>
      <text x="510" y="36" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900">90 / 90</text>
      <text x="650" y="35" fill="#58d68d" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">100.0%</text>
      <text x="800" y="35" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="13">Nov 10, 2026</text>
    </g>

    <!-- Row 2: Silver #2 -->
    <g transform="translate(0, 105)">
      <line x1="20" y1="0" x2="880" y2="0" stroke="#142b45" stroke-width="1" />
      <circle cx="58" cy="30" r="14" fill="#d1d5db" />
      <text x="58" y="35" fill="#111827" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">2</text>
      <text x="160" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">Artemis_X</text>
      <rect x="368" y="18" width="68" height="24" rx="6" fill="#183658" />
      <text x="402" y="34" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MEDIUM</text>
      <text x="510" y="36" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900">88 / 90</text>
      <text x="650" y="35" fill="#58d68d" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">91.7%</text>
      <text x="800" y="35" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="13">Nov 09, 2026</text>
    </g>

    <!-- Row 3: Bronze #3 -->
    <g transform="translate(0, 165)">
      <line x1="20" y1="0" x2="880" y2="0" stroke="#142b45" stroke-width="1" />
      <circle cx="58" cy="30" r="14" fill="#cd7f32" />
      <text x="58" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">3</text>
      <text x="160" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">Hawkeye_99</text>
      <rect x="368" y="18" width="68" height="24" rx="6" fill="#183658" />
      <text x="402" y="34" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">HARD</text>
      <text x="510" y="36" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900">86 / 90</text>
      <text x="650" y="35" fill="#58d68d" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">91.7%</text>
      <text x="800" y="35" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="13">Nov 08, 2026</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 225)">
      <line x1="20" y1="0" x2="880" y2="0" stroke="#142b45" stroke-width="1" />
      <text x="58" y="35" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">#4</text>
      <text x="160" y="35" fill="#d0dfef" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">BullseyeSam</text>
      <rect x="368" y="18" width="68" height="24" rx="6" fill="#183658" />
      <text x="402" y="34" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">EASY</text>
      <text x="510" y="36" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900">82 / 90</text>
      <text x="650" y="35" fill="#58d68d" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">83.3%</text>
      <text x="800" y="35" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="13">Nov 08, 2026</text>
