    <rect width="900" height="44" rx="14" fill="#0d213b" />
    <text x="50" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">RANK</text>
    <text x="160" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">ATHLETE</text>
    <text x="370" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">LEVEL</text>
    <text x="510" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">SCORE</text>
    <text x="650" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">HIT RATE</text>
    <text x="800" y="28" fill="#7ba0cc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1">DATE</text>

    <!-- Row 1: Gold #1 -->
    <g transform="translate(0, 45)">
      <rect width="900" height="60" fill="rgba(247,204,115,0.06)" />
      <circle cx="58" cy="30" r="14" fill="#f7cc73" />
      <text x="58" y="35" fill="#0c1726" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">1</text>
