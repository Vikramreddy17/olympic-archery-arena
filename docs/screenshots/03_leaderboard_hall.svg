<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="hallBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#142c47" />
      <stop offset="60%" stop-color="#071321" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc" />
      <stop offset="50%" stop-color="#f7cc73" />
      <stop offset="100%" stop-color="#d49a2a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#hallBg)" />

  <!-- Header -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <text y="0" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="3">LEGENDS OF THE ARENA</text>
    <text y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="900">
      HALL OF <tspan fill="url(#goldText)">FAME</tspan> 🏆
    </text>
    <text y="68" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="14">Every champion starts with a single arrow.</text>
  </g>

  <!-- Filter Buttons -->
  <g transform="translate(425, 155)">
    <rect x="0" y="0" width="75" height="34" rx="8" fill="#f7cc73" />
    <text x="37" y="22" fill="#0c1726" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" text-anchor="middle">ALL</text>

    <rect x="90" y="0" width="75" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="#1e3a5f" stroke-width="1" />
    <text x="127" y="22" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">EASY</text>

    <rect x="180" y="0" width="85" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="#1e3a5f" stroke-width="1" />
    <text x="222" y="22" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">MEDIUM</text>

    <rect x="280" y="0" width="75" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="#1e3a5f" stroke-width="1" />
    <text x="317" y="22" fill="#a4bede" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">HARD</text>
  </g>

  <!-- Leaderboard Table Card -->
  <g transform="translate(150, 215)">
    <rect width="900" height="360" rx="14" fill="rgba(7,17,33,0.85)" stroke="#1a3556" stroke-width="1.5" />
    
