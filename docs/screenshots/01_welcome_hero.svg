<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#18365a" />
      <stop offset="50%" stop-color="#091629" />
      <stop offset="100%" stop-color="#030813" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc" />
      <stop offset="50%" stop-color="#f7cc73" />
      <stop offset="100%" stop-color="#d49a2a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Topbar -->
  <rect x="0" y="0" width="1200" height="64" fill="rgba(3,8,19,0.75)" stroke="#1c3352" stroke-width="1" />
  <circle cx="48" cy="32" r="14" fill="none" stroke="#f7cc73" stroke-width="2.5" />
  <circle cx="48" cy="32" r="6" fill="#f7cc73" />
  <text x="76" y="38" fill="#f2f6ff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">
    ARCHERY <tspan fill="#f7cc73">ARENA</tspan>
  </text>
  <text x="220" y="38" fill="#7d95b5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" letter-spacing="1">THE STADIUM CHALLENGE</text>

  <!-- Topbar Action Pills -->
  <rect x="740" y="16" width="120" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#234268" stroke-width="1" />
  <text x="762" y="37" fill="#c0d4ec" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🏆 Hall of Fame</text>
  <rect x="874" y="16" width="100" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#234268" stroke-width="1" />
  <text x="892" y="37" fill="#c0d4ec" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">♫ SOUND ON</text>
  <rect x="988" y="16" width="94" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#234268" stroke-width="1" />
  <text x="1006" y="37" fill="#c0d4ec" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">⛶ Fullscreen</text>
  <rect x="1096" y="16" width="84" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#234268" stroke-width="1" />
  <text x="1114" y="37" fill="#c0d4ec" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">⚙ Operator</text>

  <!-- Hero Content Left -->
  <text x="90" y="180" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3">THE ULTIMATE STADIUM EXPERIENCE</text>
  <text x="90" y="260" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="64" font-weight="900" line-height="1.1">THE ROAD</text>
  <text x="90" y="335" fill="url(#gold)" font-family="'Segoe UI', sans-serif" font-size="64" font-style="italic" font-weight="900">TO GOLD.</text>
  <text x="90" y="380" fill="#9db6d6" font-family="'Segoe UI', sans-serif" font-size="18" max-width="500">Three targets. Twelve arrows. One champion.</text>
  <text x="90" y="406" fill="#9db6d6" font-family="'Segoe UI', sans-serif" font-size="18">Step into the arena and make every shot count.</text>

  <!-- Action Buttons -->
  <rect x="90" y="450" width="220" height="54" rx="12" fill="url(#gold)" filter="url(#glow)" />
  <text x="130" y="484" fill="#132238" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="1">START CHALLENGE ➜</text>
  
  <rect x="330" y="450" width="180" height="54" rx="12" fill="none" stroke="#406996" stroke-width="2" />
  <text x="368" y="484" fill="#f2f6ff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1">HALL OF FAME</text>

  <!-- Hero Stats Banner -->
  <g transform="translate(90, 545)">
    <rect width="450" height="68" rx="10" fill="rgba(8,20,38,0.7)" stroke="#1c3352" stroke-width="1" />
    <text x="35" y="42" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900">03</text>
    <text x="80" y="40" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">TARGETS</text>
    <line x1="160" y1="18" x2="160" y2="52" stroke="#1c3352" stroke-width="1" />
    <text x="185" y="42" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900">12</text>
    <text x="228" y="40" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">SHOTS</text>
    <line x1="305" y1="18" x2="305" y2="52" stroke="#1c3352" stroke-width="1" />
    <text x="330" y="42" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900">90</text>
    <text x="374" y="40" fill="#88a4c7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">MAX SCORE</text>
  </g>

  <!-- Target Visual Right -->
  <g transform="translate(880, 360)">
    <!-- Ambient orbit glow -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#20456d" stroke-width="1" stroke-dasharray="8 8" opacity="0.6" />
    <circle cx="0" cy="0" r="185" fill="none" stroke="#295687" stroke-width="1.5" stroke-dasharray="14 6" opacity="0.8" />
    
    <!-- Target Rings -->
    <circle cx="0" cy="0" r="150" fill="#ffffff" stroke="#cdd6e3" stroke-width="2" />
    <circle cx="0" cy="0" r="120" fill="#1b2128" stroke="#374151" stroke-width="2" />
    <circle cx="0" cy="0" r="90" fill="#008ecc" stroke="#006b99" stroke-width="2" />
    <circle cx="0" cy="0" r="60" fill="#e53935" stroke="#b71c1c" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="#ffb300" stroke="#ff8f00" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="#ffd54f" />
    <text x="0" y="5" fill="#1b2128" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">10</text>
    
    <text x="0" y="195" fill="#f7cc73" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="3" text-anchor="middle">PRECISION IS EVERYTHING</text>
  </g>
</svg>
